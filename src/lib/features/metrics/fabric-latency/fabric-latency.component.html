<app-metrics-nav pageTitle="Fabric Latency" />

@if (SHOW_FABRIC_LATENCY_CHART) {
<div class="metrics-content">

  <!-- Filter bar -->
  <div class="filter-bar">
    <div class="filter-group filter-group--wide">
      <label class="filter-label">LINK SOURCE ROUTER:</label>
      <select class="filter-select" [(ngModel)]="sourceRouter">
        @for (r of sourceRouters; track r) {
          <option [value]="r">{{ r }}</option>
        }
      </select>
    </div>

    <div class="filter-group">
      <label class="filter-label">TYPE</label>
      <select class="filter-select filter-select--sm" [(ngModel)]="selectedType">
        @for (t of types; track t) {
          <option [value]="t">{{ t }}</option>
        }
      </select>
    </div>

    <div class="filter-group">
      <label class="filter-label">DATE FILTER:</label>
      <select class="filter-select filter-select--sm" [(ngModel)]="selectedDate">
        @for (d of dateOptions; track d) {
          <option [value]="d">{{ d }}</option>
        }
      </select>
      @if (selectedDate === 'Custom Range') {
        <input type="text" class="filter-input" placeholder="For Date Range Selection">
      }
    </div>

    <div class="filter-spacer"></div>

    <div class="filter-group">
      <label class="filter-label">TARGET ROUTERS (MAX 10)</label>
      <div class="tag-input-wrap">
        @for (r of targetRouters(); track r) {
          <span class="tag-chip">
            <span class="tag-text">{{ r.toUpperCase() }}</span>
            <button class="tag-remove" (click)="removeRouter(r)" aria-label="Remove">×</button>
          </span>
        }
        <select class="tag-add-select" (change)="addRouter($event)">
          <option value=""></option>
          @for (r of routerOptions; track r) {
            @if (!targetRouters().includes(r)) {
              <option [value]="r">{{ r }}</option>
            }
          }
        </select>
      </div>
    </div>

    <div class="toggle-group">
      <button class="toggle-btn" [class.toggle-active]="allRouters" (click)="allRouters = true">
        <i class="fa-solid fa-check toggle-check"></i> All routers
      </button>
      <button
        class="toggle-btn"
        [class.toggle-active]="!allRouters"
        (click)="allRouters = false"
        title="Limit the topology and chart to only the routers visible on the current pagination page">
        <i class="fa-regular fa-file-lines"></i> This page only
      </button>
    </div>
  </div>

  <!-- Main split layout -->
  <div class="main-layout">

    <!-- Left: topology + legend -->
    <div class="topology-panel">
      <div class="topology-legend">
        <div class="legend-item">
          <svg width="14" height="14" viewBox="0 0 14 14">
            <circle cx="7" cy="7" r="6" fill="#F59E0B" stroke="#D97706" stroke-width="1.5"/>
          </svg>
          Edge Router
        </div>
        <div class="legend-item">
          <svg width="14" height="14" viewBox="0 0 14 14">
            <circle cx="7" cy="7" r="6" fill="none" stroke="#16A34A" stroke-width="1.5"/>
          </svg>
          Controller
        </div>
        <div class="legend-item">
          <svg width="14" height="14" viewBox="0 0 14 14">
            <circle cx="7" cy="7" r="6" fill="#166534" stroke="#166534" stroke-width="1.5"/>
          </svg>
          Active node
        </div>
      </div>

      <svg class="topology-svg" viewBox="0 0 440 260" preserveAspectRatio="xMidYMid meet">
        <!-- Link line -->
        <line x1="105" y1="95" x2="340" y2="190" stroke="#94A3B8" stroke-width="1.5"/>
        <!-- Link count label -->
        <text x="232" y="143" fill="#64748B" font-size="12" text-anchor="middle" font-family="Inter,sans-serif">16</text>

        <!-- Node 1: AWS us-west-2 Edge Router 1 -->
        <circle cx="105" cy="90" r="22" fill="#F59E0B" stroke="#D97706" stroke-width="2.5"/>
        <text x="105" y="124" fill="#1E293B" font-size="10" text-anchor="middle" font-family="Inter,sans-serif">AWS us-west-2</text>
        <text x="105" y="137" fill="#1E293B" font-size="10" text-anchor="middle" font-family="Inter,sans-serif">Edge Router 1</text>

        <!-- Node 2: carrie-ryan controller access -->
        <circle cx="340" cy="190" r="22" fill="#F59E0B" stroke="#D97706" stroke-width="2.5"/>
        <text x="340" y="224" fill="#1E293B" font-size="10" text-anchor="middle" font-family="Inter,sans-serif">carrie-ryan</text>
        <text x="340" y="237" fill="#1E293B" font-size="10" text-anchor="middle" font-family="Inter,sans-serif">controller access</text>
      </svg>
    </div>

    <!-- Right: SVG line chart -->
    <div class="chart-panel section-card">
      <svg class="chart-svg" [attr.viewBox]="'0 0 ' + C.vbW + ' ' + C.vbH" preserveAspectRatio="xMidYMid meet">

        <!-- Y-axis grid + labels -->
        @for (tick of yTicks; track tick) {
          <line
            [attr.x1]="C.padL" [attr.y1]="yScale(tick)"
            [attr.x2]="C.vbW - C.padR" [attr.y2]="yScale(tick)"
            stroke="#E2E8F0" stroke-width="1"/>
          <text
            [attr.x]="C.padL - 6" [attr.y]="yScale(tick) + 4"
            fill="#94A3B8" font-size="9.5" text-anchor="end" font-family="Inter,sans-serif">{{ tick }}</text>
        }

        <!-- X-axis tick labels -->
        @for (h of xTickHours; track h) {
          <line
            [attr.x1]="xScale(h)" [attr.y1]="C.padT"
            [attr.x2]="xScale(h)" [attr.y2]="C.padT + plotH"
            stroke="#F1F5F9" stroke-width="1"/>
          <text
            [attr.x]="xScale(h)" [attr.y]="C.padT + plotH + 14"
            fill="#94A3B8" font-size="9" text-anchor="middle" font-family="Inter,sans-serif">{{ formatHour(h) }}</text>
        }

        <!-- Axis border lines -->
        <line [attr.x1]="C.padL" [attr.y1]="C.padT" [attr.x2]="C.padL" [attr.y2]="C.padT + plotH" stroke="#CBD5E1" stroke-width="1"/>
        <line [attr.x1]="C.padL" [attr.y1]="C.padT + plotH" [attr.x2]="C.vbW - C.padR" [attr.y2]="C.padT + plotH" stroke="#CBD5E1" stroke-width="1"/>

        <!-- Series 2 (link2 — grey) -->
        <polyline [attr.points]="polylinePoints(chartLink2)" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linejoin="round"/>
        @for (pt of circleData(chartLink2); track $index) {
          <circle [attr.cx]="pt.cx" [attr.cy]="pt.cy" r="3" fill="white" stroke="#94A3B8" stroke-width="1.5"/>
        }

        <!-- Series 1 (link1 — dark) -->
        <polyline [attr.points]="polylinePoints(chartLink1)" fill="none" stroke="#0F172A" stroke-width="1.5" stroke-linejoin="round"/>
        @for (pt of circleData(chartLink1); track $index) {
          <circle [attr.cx]="pt.cx" [attr.cy]="pt.cy" r="3" fill="#0F172A" stroke="#0F172A" stroke-width="1"/>
        }

        <!-- X axis title -->
        <text
          [attr.x]="C.padL + plotW / 2" [attr.y]="C.vbH - 4"
          fill="#64748B" font-size="9.5" text-anchor="middle" font-family="Inter,sans-serif">
          Time Stamp - 0 to 24 hours, 1h interval
        </text>

        <!-- Y axis title (rotated) -->
        <text
          [attr.x]="-(C.padT + plotH / 2)"
          [attr.y]="13"
          fill="#64748B" font-size="9.5" text-anchor="middle"
          font-family="Inter,sans-serif"
          transform="rotate(-90)">
          Latency (average.{{ selectedType.toLowerCase() }}) In MilliSeconds
        </text>

      </svg>
    </div>
  </div>

  <!-- Pagination -->
  <div class="pagination-bar">
    <span class="pagination-info">Showing links 0 - 1 of 1</span>
    <div class="pagination-controls">
      <button class="page-btn" disabled><i class="fa-solid fa-angles-left"></i></button>
      <button class="page-btn" disabled><i class="fa-solid fa-angle-left"></i></button>
      <button class="page-btn page-btn--active">1</button>
      <button class="page-btn" disabled><i class="fa-solid fa-angle-right"></i></button>
      <button class="page-btn" disabled><i class="fa-solid fa-angles-right"></i></button>
    </div>
  </div>

</div>
} @else {
<div class="stub-body">
  <app-empty-state
    icon="fa-solid fa-clock"
    title="No fabric latency data."
    message="Fabric latency will appear here when link metrics are available." />
</div>
}

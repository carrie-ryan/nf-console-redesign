<div class="console-shell">
  <app-side-nav />
  <div class="console-main">
    <app-header />
    <app-breadcrumb />
    <main class="console-content">
      <router-outlet />
    </main>
  </div>
  <app-drawer />
  <!-- Always present so screen readers announce a toast when one appears. -->
  <div class="toast-region" aria-live="polite">
    @if (toasts.current(); as t) {
      @for (toast of [t]; track toast.id) {
        <app-toast [message]="toast.message" [variant]="toast.variant" (dismissed)="toasts.dismiss(toast.id)" />
      }
    }
  </div>
  @if (policyLauncher.launch(); as launch) {
    <app-construct-policy-modal
      [destinations]="launch.destinations"
      [flowCount]="launch.flowCount"
      (created)="policyLauncher.close()"
      (cancelled)="policyLauncher.close()" />
  }
</div>
